  grip.addEventListener("keydown", e => {   // Tastatur: Pfeiltasten docken an
    const k = { ArrowUp: "top", ArrowDown: "bottom", ArrowLeft: "left", ArrowRight: "right" }[e.key];
    if (k) { e.preventDefault(); setPalEdge(k); }
  });
  // Antippen innerhalb der Leiste darf keine Zeichengeste auslösen
  pal.addEventListener("pointerdown", e => e.stopPropagation());
  $("#optPop").addEventListener("pointerdown", e => e.stopPropagation());
  $("#bOptMore").onclick = () => $("#optPop").hidden ? openOptPop() : closeOptPop();
  try { new ResizeObserver(() => placePalette()).observe(pal); new ResizeObserver(() => placePalette()).observe(viewport); } catch {}
  addEventListener("resize", () => placePalette());
})();
function setTool(t, fromUser) {
  if (t !== S.tool) { MEAS.cur = null; measRender(); }
  if (t === "eraser" && fromUser) {
    // Radierer antippen: einmal radieren, dann zurück zum Stift/Textmarker. Nochmal antippen: Radierer bleibt.
    if (S.tool === "eraser") S.returnTool = null;
    else S.returnTool = S.eraserOnce && ["pen", "hl"].includes(S.tool) ? S.tool : null;
  } else if (t !== "eraser") S.returnTool = null;
  S.tool = t; updateChrome();
  const eb = $('.tool[data-tool="eraser"]'); if (eb) { eb.classList.toggle("once", S.tool === "eraser" && !!S.returnTool); eb.title = S.tool === "eraser" && S.returnTool ? "Radierer – einmal (nochmal tippen: bleibt aktiv)" : "Radierer (E)"; }
}

$$(".tool[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool, true));
$("#bGeo").onclick = () => { gdToggle(); $("#bGeo").setAttribute("aria-pressed", GD.on); };
$("#gRotL").onclick = () => gdRotateBy(-15); $("#gRotR").onclick = () => gdRotateBy(15);
$("#gZero").onclick = () => { GD.ang = 0; gdRender(); };
$("#gClose").onclick = () => { gdToggle(false); $("#bGeo").setAttribute("aria-pressed", "false"); };
try { new ResizeObserver(() => gdRender()).observe(viewport); } catch {}
$("#bPenOnly").onclick = () => { S.penOnly = !S.penOnly; store.set("penOnly", S.penOnly); store.set("penOnlyAuto", false); updateChrome(); };
$("#bUndo").onclick = undo; $("#bRedo").onclick = redo;
$("#bZi").onclick = () => setScale(S.scale * 1.2); $("#bZo").onclick = () => setScale(S.scale / 1.2); $("#bFit").onclick = fitWidth;
$("#bSide").onclick = () => toggleSide();
$("#bEdit").onclick = () => toggleEdit();
$("#aRotL").onclick = () => rotatePages(-1); $("#aRotR").onclick = () => rotatePages(1);
$("#aUp").onclick = () => movePages(-1); $("#aDown").onclick = () => movePages(1);
$("#aDel").onclick = deletePages;
$("#aBlank").onclick = e => openMenu(e.currentTarget, [
  { head: "Seite einfügen nach der Auswahl" },
  { label: "Leere Seite", icon: "blank", run: () => insertBlank("plain") },
  { label: "Karierte Seite (5 × 5 mm)", icon: "grid", run: () => insertBlank("grid") }
]);
$("#aAll").onclick = () => { const all = S.sel.size === S.pages.length; S.sel = new Set(all ? [] : S.pages.map(p => p.uid)); $$(".thumb").forEach(t => t.classList.toggle("sel", !all)); updateSel(); };
$("#aInsert").onclick = addPdfPages;
$("#bOpen").onclick = e => openMenu(e.currentTarget, [
  { label: "Übersicht", icon: "home", run: () => showHome(true) },
  "-",
  { head: "Öffnen" },
  { label: DESKTOP ? "PDF öffnen …" : "Vom Gerät …", icon: "device", run: openLocal },
  ...Files.st.recents.slice(0, 4).map(r => ({ label: r.name, icon: "file", run: () => openRecent(r) })),
  "-",
  { label: "Neue Notizen (kariert)", icon: "grid", run: newNotes },
  ...(S.pages.length ? [{ label: "PDF anhängen …", icon: "merge", run: addPdfPages }] : [])
]);
$("#bSave").onclick = () => save();
$("#bSaveMenu").onclick = e => openMenu(e.currentTarget, [
  { label: S.file?.path || S.file?.handle ? "Speichern (Originaldatei überschreiben)" : "Speichern", icon: "save", run: save },
  ...(DESKTOP || (window.showSaveFilePicker && !isHosted()) ? [{ label: "Speichern unter …", icon: "file", run: saveAs }] : []),
  { label: "PDF komprimieren …", icon: "compress", run: compressFlow },
  ...(DESKTOP || isHosted() ? [] : [{ label: "Als PDF herunterladen", icon: "device", run: () => download(false) }])
]);
/* Darstellung: Standard oder Glas (wird pro Gerät gemerkt) */
function setLook(look, announce) {
  document.documentElement.dataset.look = look;
  $("#bLook").classList.toggle("on", look === "glass");
  store.set("look", look); measureHeader(); syncThemeColor();
  if (announce) toast(look === "glass" ? "Glas-Design eingeschaltet." : "Standard-Design eingeschaltet.");
}
// Statusleiste des Geräts (theme-color) in der Farbe der Oberfläche: weiß/dunkel bzw. Glas-Hintergrund
function syncThemeColor() {
  const dark = document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  const glass = document.documentElement.dataset.look === "glass";
  const col = glass ? (dark ? "#0C0F15" : "#E7ECF4") : (dark ? "#1C2028" : "#FFFFFF");
  $$('meta[name="theme-color"]').forEach(m => m.remove());
  const m = document.createElement("meta"); m.name = "theme-color"; m.content = col; document.head.append(m);
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeColor); } catch {}
function measureHeader() {
  const h = $("header.bar").offsetHeight;
  if (h) document.documentElement.style.setProperty("--hdr-h", h + "px");
  if (typeof placePalette === "function") placePalette();
}
try { new ResizeObserver(measureHeader).observe($("header.bar")); } catch {}
$("#bLook").onclick = e => {
  const cur = document.documentElement.dataset.look || "standard";
  openMenu(e.currentTarget, [
    { head: "Darstellung" },
    { label: "Standard", icon: cur === "standard" ? "check" : "none", run: () => setLook("standard", true) },
    { label: "Glas (Liquid Glass)", icon: cur === "glass" ? "check" : "glass", run: () => setLook("glass", true) }
  ]);
};
$("#bHome").onclick = () => showHome(!S.home || !S.pages.length);
$("#hBack").onclick = () => showHome(false);
$("#hOpen").onclick = openLocal;
$("#hNew").onclick = newNotes;
$("#hFav").onclick = addFavorite;
$("#hSample").onclick = openSample;
$("#hClear").onclick = async () => {
  const ok = await dialog({ title: "Liste leeren?", html: "<p>Die Dateien selbst bleiben erhalten, nur die Liste „Zuletzt geöffnet“ wird geleert.</p>", buttons: [{ label: "Abbrechen", value: null }, { label: "Leeren", value: true, danger: true }] });
  if (!ok) return; Files.st.recents.forEach(forgetData); Files.st.recents = []; await Files.persist(); renderHome();
};

document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) { if (e.key === "Escape") e.target.blur(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); if (S.pages.length) (e.shiftKey ? saveAs() : save()); }
  else if (mod && e.key.toLowerCase() === "o") { e.preventDefault(); openLocal(); }
  else if (S.home) return;
  else if (mod && (e.key === "+" || e.key === "=")) { e.preventDefault(); setScale(S.scale * 1.2); }
  else if (mod && e.key === "-") { e.preventDefault(); setScale(S.scale / 1.2); }
  else if (!mod && !e.altKey) {
    const m = { v: "hand", p: "pen", h: "hl", e: "eraser", t: "text", m: "measure" }[e.key.toLowerCase()];
    if (m) setTool(m, true);
    if (e.key.toLowerCase() === "g") gdToggle();
    if (e.key === "Delete" && S.editing) deletePages();
  }
});
addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
addEventListener("resize", () => { gdRender(); clearTimeout(window.__rz); window.__rz = setTimeout(() => S.pages.forEach(renderPage), 200); });

/* Drag & Drop (Windows) */
let dragDepth = 0;
addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")) { dragDepth++; $("#drop").hidden = false; e.preventDefault(); } });
addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("#drop").hidden = true; } });
addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; $("#drop").hidden = true;
  const files = [...e.dataTransfer.files].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)); if (!files.length) return;
  let mode = "open";
  if (S.pages.length && !S.home && S.file?.origin !== "sample") {
    mode = await dialog({ title: "PDF ablegen", html: `<p>Soll „${escapeHtml(files[0].name)}“ als neues Dokument geöffnet oder an das aktuelle Dokument angehängt werden?</p>`,
      buttons: [{ label: "Abbrechen", value: null }, { label: "Anhängen", value: "insert" }, { label: "Öffnen", value: "open", primary: true }] });
    if (!mode) return;
  }
  if (mode === "open") { if (!(await confirmDiscard())) return; if (!(await openFile(await files[0].arrayBuffer(), { name: files[0].name, origin: "local" }))) return; files.shift(); }
  for (const f of files) await insertPdf(await f.arrayBuffer(), f.name);
});

/* ---------- Start ---------- */
setLook(store.get("look", "standard") === "glass" ? "glass" : "standard");
/* Offline-Modus der Web-App: Ein Service Worker legt alle Dateien beim ersten Öffnen auf dem Gerät ab.
   Nur für die veröffentlichte Web-Version (https), nicht für die .exe und nicht in claude.ai. */
function registerOffline() {
  if (DESKTOP || isHosted() || !("serviceWorker" in navigator)) return;
  if (!(location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state !== "activated") return;
        S.offlineReady = true;
        toast(hadController ? "Update installiert. App schließen und neu öffnen, um es zu nutzen." : "Offline bereit: Die App startet jetzt auch ohne Internet.");
      });
    });
  }).catch(e => console.warn("Offline-Modus nicht verfügbar:", e && e.message));
}
registerOffline();
(async function boot() {
  if (store.get("side", innerWidth > 900) === false || innerWidth <= 900) toggleSide(false); else toggleSide(true);
  updateChrome(); setDirty(false);
  try { await pdfjsReady; }
  catch (e) { toast("pdf.js konnte nicht geladen werden. Starte die App über einen Webserver oder die PDF-vibe-viewer.exe, nicht per Doppelklick auf index.html.", true); return; }
  if (DESKTOP) { const beat = () => desktopApi("/__api/ping").catch(() => {}); beat(); setInterval(beat, 10000); }
  await Files.load();
  if ("launchQueue" in window && !DESKTOP) {   // Web-App: „Öffnen mit ▸ PDF-vibe-viewer“
    launchQueue.setConsumer(async params => {
      const h = params.files && params.files[0]; if (!h) return;
      const f = await h.getFile(); await openFile(await f.arrayBuffer(), { name: f.name, origin: "local", handle: h });
    });
  }
  if (DESKTOP) {
    try {   // Datei, die per „Öffnen mit“ oder Ziehen auf die exe übergeben wurde
      const r = await desktopApi("/__api/file");
      if (r.status === 200) {
        const name = decodeURIComponent(r.headers.get("X-Filename") || "Dokument.pdf");
        const path = decodeURIComponent(r.headers.get("X-Path") || "");
        if (await openFile(await r.arrayBuffer(), { name, origin: "local", desktop: true, path: path || undefined })) return;
      }
    } catch (e) { toast("Die Datei konnte nicht geöffnet werden: " + e.message, true); }
  }
  if (!S.pages.length) showHome(true);
})();
</script>
