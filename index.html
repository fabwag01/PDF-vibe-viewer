<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PDF-vibe-viewer">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C2028" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>PDF-vibe-viewer</title>
<style>
/* Layout: zweizeilige Werkzeugleiste oben, einklappbare Seitenleiste links, Seiten als Papierbögen auf kühlem Arbeitsgrund */
:root{
  --bg:#E4E8EE; --surface:#FFFFFF; --surface-2:#F2F4F8; --ink:#1A2130; --muted:#5D6779;
  --line:#D3D9E2; --accent:#2D4FD3; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC;
  --danger:#B8402C; --ok:#2B8656; --paper-shadow:0 1px 2px rgba(20,30,50,.12),0 6px 18px rgba(20,30,50,.08);
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; /* Systemschrift: keine Verbindung ins Internet */
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1C2028; --surface-2:#252A34; --ink:#E6E9EF; --muted:#9AA3B3;
  --line:#333A46; --accent:#8FA3FF; --accent-ink:#0F1426; --accent-soft:#273153;
  --danger:#F08A73; --ok:#6FCF97; --paper-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1C2028; --surface-2:#252A34; --ink:#E6E9EF; --muted:#9AA3B3;
  --line:#333A46; --accent:#8FA3FF; --accent-ink:#0F1426; --accent-soft:#273153;
  --danger:#F08A73; --ok:#6FCF97; --paper-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Leisten ---------- */
.bar{background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center;gap:6px;min-height:46px;flex-wrap:wrap;padding-block:3px}
.row + .row{border-top:1px solid var(--line);min-height:44px}
.spacer{flex:1}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;
  background:transparent;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.tool:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.outline{border-color:var(--line)}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.split{display:inline-flex}
.split .btn.primary:first-child{border-radius:8px 0 0 8px}
.split .btn.primary:last-child{border-radius:0 8px 8px 0;width:30px;padding:0;justify-content:center;border-left:1px solid rgba(255,255,255,.25)}
.docname{display:flex;flex-direction:column;min-width:0;flex:0 1 auto;line-height:1.2;padding:0 4px}
header .row:first-child{flex-wrap:nowrap}
header .row:first-child > *{flex-shrink:0}
header .row:first-child > .docname{flex-shrink:1}
header .row:first-child > .spacer{flex-shrink:1;min-width:4px}
.docname b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
.docname small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.dot.dirty{background:#E2A21B}.dot.saved{background:var(--ok)}

.tools{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.tool{width:42px;height:36px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.tool:hover{color:var(--ink)}
.tool.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line),inset 0 0 0 1px rgba(128,128,128,.45);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent),inset 0 0 0 1px rgba(128,128,128,.45)}
.wd{width:34px;height:32px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.wd span{display:block;width:18px;border-radius:9px;background:var(--ink)}
.wd.on{background:var(--accent-soft)}
.wd.on span{background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;font-weight:500}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.op{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-left:4px}
.op input{width:120px;accent-color:var(--accent);height:28px;margin:0;touch-action:pan-x}
.op output{min-width:40px;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.op-prev{position:relative;display:inline-grid;place-items:center;width:46px;height:26px;background:#fff;border-radius:4px;box-shadow:0 0 0 1px var(--line);
  color:#1A2130;font-weight:600;font-size:13px;isolation:isolate;overflow:hidden}
.op .lbl-op{white-space:nowrap}
.op-prev i{position:absolute;left:3px;right:3px;top:6px;bottom:6px;border-radius:6px;mix-blend-mode:multiply}
.zoomval{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.pageind{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);padding:0 6px}

/* ---------- Arbeitsfläche ---------- */
#main{flex:1;display:flex;min-height:0;position:relative}
#side{width:188px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-left:env(safe-area-inset-left,0px)}
#side[hidden]{display:none!important}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 14px}
.side-head h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
#thumbs{flex:1;overflow-y:auto;padding:6px 14px 16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.thumb{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-radius:8px;padding:6px}
.thumb .tc{background:#fff;box-shadow:var(--paper-shadow);border-radius:2px;outline:2px solid transparent;outline-offset:3px;display:block}
.thumb.cur .tc{outline-color:var(--accent)}
.thumb.sel{background:var(--accent-soft)}
.thumb .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:none;place-items:center;color:var(--accent-ink)}
.editing .thumb .ck{display:grid}
.thumb.sel .ck{background:var(--accent);border-color:var(--accent)}
.side-actions{border-top:1px solid var(--line);padding:8px;display:none;grid-template-columns:repeat(4,1fr);gap:4px}
.editing .side-actions{display:grid}
.side-actions .btn{height:40px;padding:0;justify-content:center}
.side-actions .lbl{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}

#viewport{flex:1;overflow:auto;position:relative;touch-action:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pages{display:flex;flex-direction:column;align-items:center;gap:20px;min-width:min-content;
  padding:calc(24px + var(--pal-t,0px)) calc(24px + var(--pal-r,0px)) calc(120px + var(--pal-b,0px)) calc(24px + var(--pal-l,0px))}
.page{position:relative;background:#fff;box-shadow:var(--paper-shadow);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page canvas.hl,.page canvas.live.blend{mix-blend-mode:multiply}
.page .pno{position:absolute;bottom:-18px;right:0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.page .notes{position:absolute;inset:0;pointer-events:none}
.mode-text .page .notes,.mode-hand .page .notes{pointer-events:auto}
.mode-text .page{cursor:text}
.mode-pen .page,.mode-hl .page{cursor:crosshair}
.mode-eraser .page{cursor:cell}
.mode-hand #viewport{cursor:grab}

.note{position:absolute;background:#FFF5B8;border:1px solid #E3CF5A;border-radius:3px;box-shadow:0 2px 6px rgba(80,60,0,.18);
  font-size:calc(var(--fs,10) * var(--s,1) * 1px);color:#2A2414}
.note textarea{display:block;width:100%;border:0;background:transparent;resize:none;font:inherit;line-height:1.3;color:inherit;
  padding:calc(4 * var(--s,1) * 1px);overflow:hidden;outline:none;-webkit-user-select:text;user-select:text;min-height:2.6em}
.note .grip{position:absolute;top:-26px;left:-1px;display:none;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px;font-size:12px;color:var(--ink)}
.note:focus-within .grip,.mode-text .note:hover .grip{display:flex}
.note .grip button{width:26px;height:20px;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.note .grip .mv{cursor:move;touch-action:none}
.note .grip button:hover{background:var(--surface-2)}

/* ---------- Werkzeugleiste (verschiebbar, rastet an den Rändern ein) ---------- */
.pal{position:absolute;z-index:16;display:flex;align-items:center;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 6px 20px rgba(20,30,60,.14);max-width:calc(100% - 20px);max-height:calc(100% - 20px);touch-action:none}
.pal .tools{background:transparent;padding:0;gap:1px}
.pal .tool{width:38px;height:36px}
.pal .opts{flex-wrap:nowrap;gap:3px}
.pal .opts:empty{display:none}
.pal .sw{width:24px;height:24px;margin:0 1px}
.pal .wd{width:30px;height:30px}
.pal .wd span{width:16px}
.psep{width:1px;height:24px;background:var(--line);margin:0 3px;flex:none}
.grip{width:22px;height:36px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:grab;border-radius:8px;touch-action:none;flex:none}
.grip:hover{background:var(--surface-2)} .grip:active{cursor:grabbing}
.grip:focus-visible,.pal .tool:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pal.dragging{opacity:.92;box-shadow:0 14px 40px rgba(20,30,60,.28);transition:none}
.pal:not(.dragging){transition:left .18s ease,top .18s ease}
.pal .tool.more[hidden]{display:none}
.pal .tool.more.on{background:var(--accent-soft);color:var(--accent)}
.pal .tool.ic{width:32px;height:32px;border-radius:8px}
.pal .tool.ic.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.pal[data-edge="left"],.pal[data-edge="right"]{flex-direction:column;overflow-y:auto}
.pal[data-edge="left"] .tools,.pal[data-edge="right"] .tools,.pal[data-edge="left"] .opts,.pal[data-edge="right"] .opts{flex-direction:column}
.pal[data-edge="left"] .psep,.pal[data-edge="right"] .psep{width:24px;height:1px;margin:3px 0}
.pal[data-edge="left"] .grip,.pal[data-edge="right"] .grip{width:36px;height:22px;transform:rotate(90deg)}
.pal[data-edge="left"] .sw,.pal[data-edge="right"] .sw{margin:1px 0}
.pal .opts .sep{display:none}
#palHint{position:absolute;z-index:15;background:var(--accent);opacity:.35;border-radius:6px;pointer-events:none}
.pop{position:absolute;z-index:17;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(10,20,40,.18);
  padding:10px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;width:max-content;max-width:min(320px,calc(100% - 20px))}
.pop .hint{max-width:280px;line-height:1.4}
.pop .op{padding-left:0}
.pop .op .lbl-op{display:inline!important}
.pop .op input{width:130px!important}
[data-look="glass"] .pal,[data-look="glass"] .pop{background:linear-gradient(180deg,var(--glass-sheen),transparent 46%),var(--glass-bar);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
[data-look="glass"] .pal{border-radius:999px;padding:5px 8px}
[data-look="glass"] .pal[data-edge="left"],[data-look="glass"] .pal[data-edge="right"]{border-radius:26px;padding:8px 5px}
[data-look="glass"] .pal .tools{background:transparent}
[data-look="glass"] .pal .tool.ic.on,[data-look="glass"] .pal .tool.more.on{background:var(--glass-sel)}
[data-look="glass"] .pop{border-radius:22px}
@media (pointer:coarse){
  .pal .tool{width:42px;height:40px}
  .pal .sw{width:28px;height:28px}
  .pal .wd{width:34px;height:34px}
  .grip{width:26px;height:40px}
  .pal[data-edge="left"] .grip,.pal[data-edge="right"] .grip{width:40px;height:26px}
}

/* ---------- Geodreieck & Messen ---------- */
:root{ --geo-fill:rgba(205,224,255,.30); --geo-edge:rgba(45,79,211,.85); --geo-ink:#1E3A8A; --geo-ink2:#5A6FB8; --meas:#D9480F; }
#geo{position:fixed;pointer-events:none;z-index:12;overflow:hidden;display:none}
#geo.on{display:block}
#geo svg{width:100%;height:100%;display:block}
.geo-body{fill:var(--geo-fill);stroke:var(--geo-edge);stroke-width:1.5;filter:drop-shadow(0 3px 8px rgba(20,40,110,.22))}
.geo-tick{stroke:var(--geo-ink);stroke-width:.9;fill:none}
.geo-arc{stroke:var(--geo-ink);stroke-width:.9;fill:none}
.geo-aux{stroke:var(--geo-ink2);stroke-width:.8;stroke-dasharray:4 4;fill:none}
.geo-zero{fill:none;stroke:var(--geo-ink);stroke-width:1.2}
.geo-num{fill:var(--geo-ink);font-family:var(--font-ui);font-weight:600;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.geo-num2{fill:var(--geo-ink2);font-weight:500}
.geo-read{fill:var(--geo-ink);font-family:var(--font-ui);font-weight:700;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.geo-handle circle{fill:rgba(255,255,255,.9);stroke:var(--geo-edge);stroke-width:1.5}
.geo-handle path{fill:none;stroke:var(--geo-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#geoPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--pal-b,0px) + env(safe-area-inset-bottom,0px));z-index:13;display:none;align-items:center;gap:2px;
  padding:4px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px rgba(10,20,40,.18)}
#geoPanel.on{display:flex}
.geo-on #toasts{bottom:calc(78px + var(--pal-b,0px) + env(safe-area-inset-bottom,0px))}
#geoPanel .val{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.meas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.meas path{fill:none;stroke:var(--meas);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.meas .vx{fill:var(--meas)}
.meas .lbl rect{fill:var(--meas)}
.meas .lbl text{fill:#fff;font-family:var(--font-ui);font-weight:600;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}
.note.plain{background:transparent;border-color:transparent;box-shadow:none;color:var(--nc,#1A2130);font-weight:600}
.note.plain:focus-within{border:1px dashed var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.hint{color:var(--muted);font-size:13px}

/* ---------- Leerzustand / Ablage ---------- */
#drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--accent-soft) 70%,transparent);
  display:grid;place-items:center;font-size:18px;font-weight:600;color:var(--accent);pointer-events:none;z-index:5}

/* ---------- Übersicht ---------- */
#home{position:absolute;inset:0;z-index:15;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch}
.home-in{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:30px}
.home-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.home-top h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;flex:1;text-wrap:balance}
.home-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.act{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:1px;align-items:center;text-align:left;
  padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.act:hover{border-color:var(--accent)}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act .ai{grid-row:1/3;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.act.primary .ai{background:var(--accent);color:var(--accent-ink)}
.act b{font-weight:600;font-size:15px;align-self:end}
.act small{color:var(--muted);font-size:12.5px;align-self:start}
.h2row{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.h2row h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:1}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:4px 2px;font-weight:500}
.lnk:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.recent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.rc{position:relative;display:flex;flex-direction:column;gap:9px;cursor:pointer;border-radius:12px;padding:10px;min-width:0}
.rc:hover{background:var(--surface)}
.rc:focus-visible{outline:2px solid var(--accent);background:var(--surface)}
.rc-th{aspect-ratio:3/4;background:var(--surface-2);border-radius:4px;overflow:hidden;display:grid;place-items:center;max-width:100%;box-shadow:var(--paper-shadow)}
.rc-th img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.rc-th .ph{color:var(--muted)}
.rc-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc b{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.rc small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rc .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:none;place-items:center;cursor:pointer;color:var(--ink)}
.rc:hover .x,.rc:focus-within .x{display:grid}
@media (hover:none){.rc .x{display:grid}}
.empty{grid-column:1/-1;padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;line-height:1.5}
.fav-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fav{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.fav:last-child{border-bottom:0}
.fav:hover{background:var(--surface-2)}
.fav:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fav .ic{color:var(--accent);display:grid}
.fav .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav.add b{color:var(--accent);font-weight:500}
.star,.fav-on svg,[data-fav].on svg{color:#D99A00}
.home-foot{margin:0;color:var(--muted);font-size:13px}
.pal .tool.once{position:relative}
.pal .tool.once::after{content:"1";position:absolute;right:2px;bottom:2px;min-width:13px;height:13px;border-radius:7px;background:var(--accent);color:#fff;font:700 9px/13px system-ui,sans-serif;text-align:center;padding:0 2px}
.at-home #palette,.at-home #optPop,.at-home #bSide,.at-home .split,.at-home #bPenOnly,.at-home .grp,.at-home .sep,.at-home #side{display:none!important}
.at-home #viewport{visibility:hidden}
#bHome.on{background:var(--accent-soft);color:var(--accent)}

/* ---------- Datei-Browser ---------- */
.dlg.fbd{width:min(880px,100%);height:min(660px,88vh)}
.fbd header .btn.on{background:var(--accent-soft)}
.fb{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:0;flex:1;border-top:1px solid var(--line)}
.fb-side{border-right:1px solid var(--line);overflow:auto;padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2)}
.fb-side .mh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.fb-side button{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;font:inherit;color:var(--ink);flex:none}
.fb-side button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-side button:hover{background:var(--surface)}
.fb-side button.on{background:var(--accent-soft);color:var(--accent)}
.fb-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.fb-crumbs{display:flex;gap:2px;flex-wrap:wrap;align-items:center;padding:10px 14px;font-size:13px}
.fb-crumbs button{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:4px 6px;border-radius:6px;font:inherit}
.fb-crumbs button:last-child{color:var(--ink);font-weight:600}
.fb-crumbs span{color:var(--muted)}
.fb-list{overflow:auto;flex:1;min-height:200px;border-top:1px solid var(--line)}
.fb-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.fb-item:hover{background:var(--surface-2)}
.fb-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fb-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.fb-item .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fb-item .ic{color:var(--muted);display:grid} .fb-item.dir .ic{color:var(--accent)}
.fb-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.fb-empty .spin{display:inline-block}
.fb-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb-foot input{flex:1;min-width:160px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit}
.fb-foot input:focus{outline:2px solid var(--accent);border-color:transparent}
.fb-hint{color:var(--muted);font-size:13px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .fb{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .fb-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .fb-side .mh{display:none}
  .fbd header [data-fav] span{display:none}
}

/* ---------- Komprimieren ---------- */
.lv{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.lv label{display:grid;grid-template-columns:22px 1fr;gap:2px 10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.lv label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.lv input{grid-row:1/3;accent-color:var(--accent);margin:3px 0 0}
.lv b{font-weight:600}
.lv small{color:var(--muted);line-height:1.4}
.cmp{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px;border-radius:12px;background:var(--surface-2);margin:8px 0 12px}
.cmp div{display:flex;flex-direction:column;gap:2px}
.cmp small{color:var(--muted);font-size:12px}
.cmp b{font-size:21px;font-variant-numeric:tabular-nums;font-weight:600}
.cmp .arr{color:var(--muted);display:grid}
.cmp .gain{margin-left:auto;color:var(--ok);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}

/* ---------- Menüs, Dialoge, Toasts ---------- */
.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,20,40,.18);
  padding:6px;min-width:250px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu .mh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px;font-weight:600}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(12,18,30,.38);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(520px,100%);max-height:min(86vh,720px);display:flex;flex-direction:column;overflow:hidden}
.dlg.wide{width:min(720px,100%)}
.dlg header{padding:18px 20px 8px;display:flex;align-items:center;gap:10px}
.dlg header h3{margin:0;font-size:18px;font-weight:600;text-wrap:balance;flex:1}
.dlg .body{padding:4px 20px 12px;overflow:auto;line-height:1.5;color:var(--ink);-webkit-user-select:text;user-select:text}
.dlg .body p{margin:.4em 0;color:var(--muted);max-width:62ch}
.dlg footer{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:13px;font-weight:600}
.field input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);padding:0 12px;font:inherit}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
code.cp{display:block;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12.5px;word-break:break-all;font-family:ui-monospace,Consolas,monospace}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--pal-b,0px) + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:560px;animation:tin .18s ease-out}
.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.busy{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(12,18,30,.25)}
.busy div{background:var(--surface);padding:14px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500;display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* ================= Darstellung „Glas“ (angelehnt an Liquid Glass) =================
   Schwebende, durchscheinende Leisten über einem farbigen Grund; die Seiten scrollen darunter. */
:root{
  --scene:radial-gradient(1100px 760px at 8% -12%,#C9DCFF 0%,transparent 62%),radial-gradient(900px 700px at 108% 18%,#F1D6F6 0%,transparent 58%),
          radial-gradient(1000px 900px at 46% 118%,#CDEFE4 0%,transparent 62%),#E7ECF4;
  --glass:rgba(255,255,255,.62); --glass-bar:rgba(250,252,255,.8); --glass-strong:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.78);
  --glass-hi:rgba(255,255,255,.95); --glass-sheen:rgba(255,255,255,.5); --glass-inset:rgba(24,36,70,.07);
  --glass-sel:rgba(255,255,255,.9); --glass-shadow:0 12px 32px rgba(32,48,96,.16),0 1px 3px rgba(32,48,96,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --scene:radial-gradient(1100px 760px at 8% -12%,#1C2B57 0%,transparent 62%),radial-gradient(900px 700px at 108% 18%,#3A1E4C 0%,transparent 58%),
          radial-gradient(1000px 900px at 46% 118%,#0F3A33 0%,transparent 62%),#0C0F15;
  --glass:rgba(30,36,52,.62); --glass-bar:rgba(26,31,45,.8); --glass-strong:rgba(34,40,56,.86); --glass-edge:rgba(255,255,255,.14);
  --glass-hi:rgba(255,255,255,.2); --glass-sheen:rgba(255,255,255,.07); --glass-inset:rgba(255,255,255,.07);
  --glass-sel:rgba(255,255,255,.17); --glass-shadow:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.45) }}
:root[data-theme="dark"]{
  --scene:radial-gradient(1100px 760px at 8% -12%,#1C2B57 0%,transparent 62%),radial-gradient(900px 700px at 108% 18%,#3A1E4C 0%,transparent 58%),
          radial-gradient(1000px 900px at 46% 118%,#0F3A33 0%,transparent 62%),#0C0F15;
  --glass:rgba(30,36,52,.62); --glass-bar:rgba(26,31,45,.8); --glass-strong:rgba(34,40,56,.86); --glass-edge:rgba(255,255,255,.14);
  --glass-hi:rgba(255,255,255,.2); --glass-sheen:rgba(255,255,255,.07); --glass-inset:rgba(255,255,255,.07);
  --glass-sel:rgba(255,255,255,.17); --glass-shadow:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.45) }
@media (prefers-reduced-transparency: reduce){ :root{ --glass:var(--surface); --glass-bar:var(--surface); --glass-strong:var(--surface) } }
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ :root{ --glass:var(--surface); --glass-bar:var(--surface); --glass-strong:var(--surface) } }

[data-look="glass"] body{background:var(--scene);background-attachment:fixed}
/* Übersicht deckt das geöffnete Dokument vollständig ab (eigener Farbverlauf statt durchsichtig) */
[data-look="glass"] #home{background:var(--scene);background-attachment:fixed}
/* Material */
[data-look="glass"] .bar,[data-look="glass"] #side,[data-look="glass"] .act,[data-look="glass"] .fav-list,[data-look="glass"] .note .grip{
  background:linear-gradient(180deg,var(--glass-sheen),transparent 46%),var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
[data-look="glass"] .menu,[data-look="glass"] .dlg,[data-look="glass"] .toast{
  background:linear-gradient(180deg,var(--glass-sheen),transparent 40%),var(--glass-strong);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
/* schwebende Kopfleiste */
[data-look="glass"] #app{position:relative}
[data-look="glass"] .bar{background:linear-gradient(180deg,var(--glass-sheen),transparent 46%),var(--glass-bar);position:absolute;z-index:30;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  border-radius:26px;padding-left:12px;padding-right:12px}
[data-look="glass"] .row + .row{border-top-color:var(--glass-inset)}
[data-look="glass"] #pages{padding-top:calc(var(--hdr-h,56px) + 24px + var(--pal-t,0px))}
[data-look="glass"] .home-in{padding-top:calc(var(--hdr-h,60px) + 34px)}
[data-look="glass"] #side{margin:calc(var(--hdr-h,112px) + 22px) 0 12px max(10px,env(safe-area-inset-left,0px));border-radius:24px;overflow:hidden;padding-left:0}
[data-look="glass"] .side-actions{border-top-color:var(--glass-inset)}
/* Bedienelemente als Kapseln */
[data-look="glass"] .btn{border-radius:999px}
[data-look="glass"] .btn:hover{background:var(--glass-inset)}
[data-look="glass"] .btn.outline{border-color:var(--glass-edge);background:var(--glass-inset)}
[data-look="glass"] .btn.on,[data-look="glass"] #bHome.on,[data-look="glass"] #bLook.on{background:var(--glass-sel);color:var(--accent);box-shadow:inset 0 1px 0 var(--glass-hi),0 1px 3px rgba(0,0,0,.1)}
[data-look="glass"] .btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,#fff),var(--accent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
[data-look="glass"] .split .btn.primary:first-child{border-radius:999px 0 0 999px}
[data-look="glass"] .split .btn.primary:last-child{border-radius:0 999px 999px 0}
[data-look="glass"] .tools{background:var(--glass-inset);border-radius:999px;padding:4px}
[data-look="glass"] .tool{border-radius:999px}
[data-look="glass"] .tool.on{background:var(--glass-sel);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 6px rgba(0,0,0,.12)}
[data-look="glass"] .chip{background:var(--glass-inset);border-color:var(--glass-edge)}
[data-look="glass"] .chip.on{background:var(--glass-sel)}
[data-look="glass"] .wd{border-radius:999px}
[data-look="glass"] .wd.on{background:var(--glass-sel)}
[data-look="glass"] .thumb{border-radius:16px}
[data-look="glass"] .thumb.sel{background:var(--glass-sel)}
/* Menüs, Dialoge, Meldungen */
[data-look="glass"] .menu{border-radius:20px;padding:8px}
[data-look="glass"] .menu button{border-radius:12px}
[data-look="glass"] .menu button:hover{background:var(--glass-inset)}
[data-look="glass"] .menu hr{border-top-color:var(--glass-inset)}
[data-look="glass"] .scrim{background:rgba(10,16,32,.16);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
[data-look="glass"] .dlg{border-radius:28px}
[data-look="glass"] .field input,[data-look="glass"] .fb-foot input{background:var(--glass-inset);border-color:var(--glass-edge);border-radius:14px}
[data-look="glass"] .lv label{border-color:var(--glass-edge);border-radius:16px}
[data-look="glass"] .lv label:has(input:checked){background:var(--glass-sel)}
[data-look="glass"] .cmp{background:var(--glass-inset);border-radius:18px}
[data-look="glass"] .fb{border-top-color:var(--glass-inset)}
[data-look="glass"] .fb-side{background:transparent;border-color:var(--glass-inset)}
[data-look="glass"] .fb-side button.on{background:var(--glass-sel)}
[data-look="glass"] .fb-item,[data-look="glass"] .fb-list,[data-look="glass"] .fb-foot{border-color:var(--glass-inset)}
[data-look="glass"] .fb-item:hover{background:var(--glass-inset)}
[data-look="glass"] .toast{color:var(--ink);border-radius:999px;padding:11px 20px}
[data-look="glass"] .toast.err{background:color-mix(in srgb,var(--danger) 88%,transparent);color:#fff}
[data-look="glass"] #geoPanel{background:linear-gradient(180deg,var(--glass-sheen),transparent 46%),var(--glass-bar);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-color:var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi)}
[data-look="glass"] .seg{border-color:var(--glass-edge);background:var(--glass-inset)}
[data-look="glass"] .seg button.on{background:var(--glass-sel)}
[data-look="glass"] .busy div{background:var(--glass-strong);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:999px}
/* Übersicht */
[data-look="glass"] .act{border-radius:22px}
[data-look="glass"] .act:hover{border-color:var(--glass-hi)}
[data-look="glass"] .act .ai{border-radius:14px}
[data-look="glass"] .fav-list{border-radius:22px}
[data-look="glass"] .fav{border-bottom-color:var(--glass-inset)}
[data-look="glass"] .fav:hover,[data-look="glass"] .rc:hover{background:var(--glass-inset)}
[data-look="glass"] .rc{border-radius:20px}
[data-look="glass"] .empty{border-color:var(--glass-edge);border-radius:20px}
@media (max-width:900px){
  [data-look="glass"] #side{position:absolute;margin:0;top:calc(var(--hdr-h,112px) + 20px);bottom:12px;left:max(10px,env(safe-area-inset-left,0px))}
}
/* Touch (iPad): obere Leiste mit mehr Abstand zum Bildschirmrand und größeren Zielen */
@media (pointer:coarse){
  .bar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header .row:first-child{min-height:50px;padding-block:5px;gap:6px}
  header .btn{height:38px} header .btn.icon{width:38px}
  [data-look="glass"] .bar{top:10px;padding-left:14px;padding-right:14px;border-radius:26px}
  .tool{width:42px;height:40px}
  .sw{width:28px;height:28px}
}
/* Als Web-App vom Home-Bildschirm: Abstand zur Statusleiste bzw. zu den Fenstersymbolen von iPadOS */
@media (display-mode:standalone){
  header.bar{padding-top:max(6px,env(safe-area-inset-top,0px))}
  [data-look="glass"] header.bar{padding-top:0;top:calc(14px + env(safe-area-inset-top,0px))}
}
@media (max-width:900px){
  .op .lbl-op{display:none} .op input{width:88px} .opts{gap:4px} .tool{width:40px}
  #side{position:absolute;left:0;top:0;bottom:0;z-index:20;box-shadow:8px 0 24px rgba(0,0,0,.15)}
  .hide-s{display:none}
}
@media (max-width:560px){ .hide-xs{display:none} .docname b,.docname small{max-width:44vw} #saveLbl,#bPenOnly,#bRedo{display:none} }
</style>

</head>
<body>
<div id="app" class="mode-pen">
  <header class="bar">
    <div class="row">
      <button class="btn icon" id="bHome" title="Übersicht" aria-label="Übersicht" data-i="home"></button>
      <button class="btn icon" id="bLook" title="Darstellung" aria-label="Darstellung" aria-haspopup="menu" data-i="glass"></button>
      <button class="btn icon" id="bSide" title="Seitenleiste (Seiten bearbeiten)" aria-label="Seitenleiste" data-i="pages"></button>
      <button class="btn outline" id="bOpen" aria-haspopup="menu"><span data-i="open"></span><span class="hide-xs">Öffnen</span><span data-i="chev" data-s="14"></span></button>
      <div class="docname"><b id="docName">–</b><small id="docInfo"><span class="dot"></span>Kein Dokument</small></div>
      <div class="spacer"></div>
      <span class="pageind hide-s" id="pageInd">–</span>
      <button class="chip" id="bPenOnly" title="Nur der Stift zeichnet, Finger scrollt und zoomt">Nur Stift</button>
      <div class="grp">
        <button class="btn icon" id="bUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig" data-i="undo"></button>
        <button class="btn icon" id="bRedo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen" data-i="redo"></button>
      </div>
      <div class="sep hide-s"></div>
      <div class="grp hide-s">
        <button class="btn icon" id="bZo" aria-label="Verkleinern" data-i="minus"></button>
        <span class="zoomval" id="zoomVal">100%</span>
        <button class="btn icon" id="bZi" aria-label="Vergrößern" data-i="plus"></button>
        <button class="btn icon" id="bFit" title="Seitenbreite" aria-label="An Breite anpassen" data-i="fit"></button>
      </div>
      <div class="split">
        <button class="btn primary" id="bSave"><span data-i="save"></span><span id="saveLbl">Speichern</span></button>
        <button class="btn primary" id="bSaveMenu" aria-label="Weitere Speicheroptionen" data-i="chev" data-s="14"></button>
      </div>
    </div>
  </header>

  <div id="main">
    <aside id="side">
      <div class="side-head"><h2>Seiten</h2><button class="btn" id="bEdit" style="height:30px;font-size:13px">Bearbeiten</button></div>
      <div id="thumbs"></div>
      <div class="side-actions">
        <div class="lbl" id="selLbl">Seiten antippen zum Auswählen</div>

function dialog({ title, html = "", buttons = [{ label: "OK", value: true, primary: true }], wide = false, onOpen }) {
  return new Promise(res => {
    const sc = document.createElement("div"); sc.className = "scrim";
    sc.innerHTML = `<div class="dlg${wide ? " wide" : ""}" role="dialog" aria-modal="true"><header><h3></h3></header><div class="body">${html}</div><footer></footer></div>`;

      const bt = document.createElement("button"); bt.className = "btn " + (b.primary ? "primary" : b.danger ? "outline" : "outline");
      if (b.danger) bt.style.color = "var(--danger)";
      bt.textContent = b.label; bt.onclick = () => close(typeof b.value === "function" ? b.value(sc) : b.value);
      $("footer", sc).append(bt);
    });
    sc.addEventListener("pointerdown", e => { if (e.target === sc) close(null); });
    sc.addEventListener("keydown", e => { if (e.key === "Escape") close(null); });
    document.body.append(sc);
    onOpen && onOpen(sc, close);
    const f = $("input", sc) || $("footer .primary", sc); f && f.focus();
  });
}

function openMenu(anchor, items) {
  closeMenu();
  const m = document.createElement("div"); m.className = "menu"; m.id = "menu"; m.setAttribute("role", "menu");
  items.forEach(it => {
    if (it === "-") { m.append(document.createElement("hr")); return; }
    if (it.head) { const h = document.createElement("div"); h.className = "mh"; h.textContent = it.head; m.append(h); return; }
    const b = document.createElement("button"); b.setAttribute("role", "menuitem");
    b.innerHTML = svg(it.icon || "file", 18) + "<span></span>"; $("span", b).textContent = it.label;
    b.onclick = () => { closeMenu(); it.run(); }; m.append(b);
  });
  document.body.append(m);
  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth, h = m.offsetHeight;
  const below = innerHeight - r.bottom - 8, above = r.top - 8;
  const top = h <= below || below >= above ? r.bottom + 6 : r.top - h - 6;
  m.style.top = clamp(top, 8, Math.max(8, innerHeight - h - 8)) + "px";
  m.style.left = clamp(r.left, 8, innerWidth - w - 8) + "px";
  setTimeout(() => document.addEventListener("pointerdown", menuAway, true), 0);
}

async function addSource(bytes) {
  const id = uid();
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice(), ...PDFJS_OPTS }).promise;
  S.sources[id] = { bytes, pdf, lib: null };
  const pages = [];
  for (let i = 0; i < pdf.numPages; i++) {
    const pg = await pdf.getPage(i + 1);
    const vp = pg.getViewport({ scale: 1, rotation: 0 });
    pages.push({ uid: uid(), src: id, idx: i, baseRot: pg.rotate || 0, rot: 0, w0: vp.width, h0: vp.height, strokes: [], notes: [] });
  }
  return pages;
}

    const found = m.refs.every(r => arr.some(x => x instanceof PDFRef && x.toString() === r));

    p.strokes.forEach(s => { for (let k = 0; k < s.p.length; k += 3) { const [nx, ny] = tf(s.p[k], s.p[k + 1]); s.p[k] = +nx.toFixed(2); s.p[k + 1] = +ny.toFixed(2); } });
    p.notes.forEach(n => {
      const h = (n.text.split("\n").length) * (n.fs || 10) * 1.3 + 8;
      const [nx, ny] = dir > 0 ? [H - n.y - h, n.x] : [n.y, W - n.x - n.w];

  idx.forEach(i => { const p = S.pages[i]; const v = views.get(p.uid); v.key = ""; renderNotes(p); thumbDirty(p); });
  layout(); idx.forEach(i => renderPage(S.pages[i])); setDirty(true);
}
function deletePages() {

}

/* ---------- Seitenleiste ---------- */
let tio = null; const thumbQ = []; let thumbBusy = false;
const thumbKeys = new Map();
function buildThumbs() {
  const box = $("#thumbs"); box.innerHTML = "";
  tio && tio.disconnect(); thumbKeys.clear(); thumbQ.length = 0;
  tio = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) queueThumb(pageByUid(en.target.dataset.uid)); }), { root: box, rootMargin: "300px 0px" });
  S.pages.forEach((p, i) => {
    const t = document.createElement("div"); t.className = "thumb"; t.dataset.uid = p.uid; t.tabIndex = 0;
    const [W, H] = dims(p), tw = 128, th = Math.round(tw * H / W);
    t.innerHTML = `<canvas class="tc" style="width:${tw}px;height:${th}px"></canvas><span class="n">${i + 1}</span><span class="ck">${svg("check", 14)}</span>`;
    t.classList.toggle("sel", S.sel.has(p.uid));
    t.addEventListener("click", () => {
      if (S.editing) { S.sel.has(p.uid) ? S.sel.delete(p.uid) : S.sel.add(p.uid); t.classList.toggle("sel"); updateSel(); }
      else { scrollToPage(S.pages.indexOf(p)); if (innerWidth <= 900) toggleSide(false); }
    });
    t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t.click(); } });
    box.append(t); tio.observe(t);

}
function thumbDirty(p) { if (!p) return; thumbKeys.delete(p.uid); const t = $(`.thumb[data-uid="${p.uid}"]`); if (t) { const [W, H] = dims(p); const c = $(".tc", t); c.style.height = Math.round(128 * H / W) + "px"; queueThumb(p); } }
function queueThumb(p) { if (!p || thumbQ.includes(p)) return; thumbQ.push(p); pumpThumbs(); }
async function pumpThumbs() {
  if (thumbBusy) return; thumbBusy = true;
  while (thumbQ.length) {
    const p = thumbQ.shift(); if (!S.pages.includes(p)) continue;
    const t = $(`.thumb[data-uid="${p.uid}"]`); if (!t) continue;
    const key = total(p) + "|" + p.strokes.length + "|" + p.notes.length + "|" + (p.strokes[p.strokes.length - 1]?.p.length || 0);
    if (thumbKeys.get(p.uid) === key) continue;

}

/* =====================================================================
   Export: Annotationen in die PDF schreiben
   ===================================================================== */
function winAnsi(t) { return t.replace(/[‘’]/g, "'").replace(/[“”„]/g, '"').replace(/[–—]/g, "-").replace(/[^\x20-\x7E\xA0-\xFF\n€]/g, "?"); }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return PDFLib.rgb((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); }

async function buildPdf() {
  const { PDFDocument, StandardFonts, degrees, BlendMode, LineCapStyle, PDFName, PDFHexString, rgb } = PDFLib;
  const out = await PDFDocument.create();
  if (S.file?.name) out.setTitle(S.file.name.replace(/\.pdf$/i, ""));
  out.setProducer("PDF-vibe-viewer (Prototyp)");
  let font = null, bold = null;
  const meta = { v: 1, pages: [] };
  for (const p of S.pages) {
    const src = S.sources[p.src];
    if (!src.lib) src.lib = await PDFDocument.load(src.bytes, { ignoreEncryption: true, updateMetadata: false });
    const [pg] = await out.copyPages(src.lib, [p.idx]);
    out.addPage(pg);
    const rot = total(p); pg.setRotation(degrees(rot));
    const has = p.strokes.length || p.notes.length;
    const m = { refs: [], strokes: p.strokes, notes: p.notes };
    if (has) {
      const pj = await src.pdf.getPage(p.idx + 1);
      const vp = pj.getViewport({ scale: 1, rotation: rot });
      const T = (x, y) => vp.convertToPdfPoint(x, y);
      // vorhandenen Seiteninhalt kapseln, damit Transformationen der Vorlage die Zeichnung nicht verschieben
      try {
        pg.node.normalize();
        const qa = out.context.register(out.context.contentStream([PDFLib.pushGraphicsState()]));
        const qb = out.context.register(out.context.contentStream([PDFLib.popGraphicsState()]));
        if (pg.node.wrapContentStreams(qa, qb)) m.refs.push(qa.toString(), qb.toString());
      } catch (e) { console.warn("wrap", e); }
      const ordered = [...p.strokes.filter(s => s.t === "hl"), ...p.strokes.filter(s => s.t !== "hl")];
      for (const s of ordered) {
        const a = s.p, n = a.length / 3; if (!n) continue;
        const P = i => { const [x, y] = T(a[i * 3], a[i * 3 + 1]); return `${x.toFixed(2)} ${(-y).toFixed(2)}`; };
        let d = "M " + P(0);
        if (n === 1) { const [x, y] = T(a[0] + .01, a[1] + .01); d += ` L ${x.toFixed(2)} ${(-y).toFixed(2)}`; }
        else if (s.sh) { for (let i = 1; i < n; i++) d += " L " + P(i); if (n > 2 && Math.hypot(a[0] - a[(n - 1) * 3], a[1] - a[(n - 1) * 3 + 1]) < 0.05) d += " Z"; }
        else if (n === 2) d += " L " + P(1);
        else {
          for (let i = 1; i < n - 1; i++) {
            const [mx, my] = T((a[i * 3] + a[i * 3 + 3]) / 2, (a[i * 3 + 1] + a[i * 3 + 4]) / 2);
            d += ` Q ${P(i)} ${mx.toFixed(2)} ${(-my).toFixed(2)}`;
          }
          d += " L " + P(n - 1);
        }
        const isHl = s.t === "hl";
        pg.drawSvgPath(d, { x: 0, y: 0, borderColor: hexRgb(s.c), borderWidth: isHl ? s.w : s.w * pf(s.pr ? avgPressure(a) : .5),
          borderOpacity: isHl ? clamp(s.o ?? 1, 0.05, 1) : 1, borderLineCap: isHl ? LineCapStyle.Butt : LineCapStyle.Round, blendMode: isHl ? BlendMode.Multiply : BlendMode.Normal });
      }
      if (p.notes.length) {
        font = font || await out.embedFont(StandardFonts.Helvetica);
        if (p.notes.some(n => n.plain)) bold = bold || await out.embedFont(StandardFonts.HelveticaBold);
        for (const nt of p.notes) {
          const fs = nt.fs || 10, lh = fs * 1.3, maxW = nt.w - 8;
          const lines = [];
          winAnsi(nt.text).split("\n").forEach(par => {
            let line = "";
            par.split(" ").forEach(w => { const t = line ? line + " " + w : w; if (font.widthOfTextAtSize(t, fs) > maxW && line) { lines.push(line); line = w; } else line = t; });
            lines.push(line);
          });
          const h = lines.length * lh + 8;
          const [bx, by] = T(nt.x, nt.y + h);
          if (!nt.plain) pg.drawRectangle({ x: bx, y: by, width: nt.w, height: h, color: rgb(1, .961, .722), borderColor: rgb(.89, .81, .35), borderWidth: .6, rotate: degrees(rot) });
          lines.forEach((l, i) => {
            const [tx, ty] = T(nt.x + 4, nt.y + 4 + i * lh + fs * 0.95);
            pg.drawText(l, { x: tx, y: ty, size: fs, font: nt.plain ? bold : font, color: nt.plain ? hexRgb(nt.c || "#1A2130") : rgb(.16, .14, .08), rotate: degrees(rot) });
          });
        }
      }
      if (pg.contentStreamRef) m.refs.push(pg.contentStreamRef.toString());
    }
    meta.pages.push(m);
  }
  out.catalog.set(PDFName.of(CONFIG.layerKey), PDFHexString.fromText(JSON.stringify(meta)));
  return await out.save();
}

/* =====================================================================
   Dateien: Öffnen, Speichern, zuletzt geöffnet, Favoriten-Ordner
   exe: echte Dateipfade über den eingebauten Server
   Web (Edge/Chrome): Datei- und Ordnerfreigaben des Browsers (in IndexedDB gemerkt)
   Web (iPad/Safari): Kopie der Datei in der App

const IDB = {
  db: null,
  open() {
    if (!this.db) this.db = new Promise((res, rej) => {
      const r = indexedDB.open("randnotiz", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", mode), r = fn(t.objectStore("kv"));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.tx("readonly", s => s.get(k)); },
  set(k, v) { return this.tx("readwrite", s => s.put(v, k)); },
  del(k) { return this.tx("readwrite", s => s.delete(k)); }
};
// Als gehostete Seite in claude.ai (z. B. am iPad) läuft die App in einem geschützten Rahmen:

  get dirs() { return DESKTOP || (!isHosted() && "showDirectoryPicker" in window); }      // Ordner-Favoriten
};
let hostedDownloads;
function viewerDownloads() {

  if (!hostedDownloads) hostedDownloads = window.claude.use("downloads").catch(() => null);
  return hostedDownloads;
}
const Files = {
  st: { recents: [], favorites: [], lastFolder: "" },

      this.st = { recents: [], favorites: [], lastFolder: "", ...(v || {}) };

const MAX_RECENTS = 16, MAX_COPIES = 8;
const baseName = p => p.split(/[\\/]/).filter(Boolean).pop() || p;
const dirName = p => { const i = Math.max(p.lastIndexOf("\\"), p.lastIndexOf("/")); return i > 0 ? p.slice(0, i) : p; };
function shortDir(p) {
  const parts = dirName(p).split(/[\\/]/).filter(Boolean);
  return parts.length > 3 ? "… › " + parts.slice(-2).join(" › ") : parts.join(" › ");
}

  if (f.handle) return "Auf dem Gerät";
  return "Kopie in der App";
}
function relTime(ms) {
  const d = new Date(ms), now = new Date(), day = 864e5;
  const t = d.toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (ms >= start) return "Heute, " + t;
  if (ms >= start - day) return "Gestern, " + t;
  if (ms >= start - 6 * day) return d.toLocaleDateString("de-AT", { weekday: "long" }) + ", " + t;
  return d.toLocaleDateString("de-AT", { day: "2-digit", month: "2-digit", year: "numeric" });
}
const fmtSize = b => b == null ? "" : b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1).replace(".", ",") + " MB";

/* Seite in ein Canvas zeichnen (für Vorschaubilder) */
async function paintPage(c, p, cssW, dprCap = 2) {
  const [W] = dims(p), dpr = Math.min(devicePixelRatio || 1, dprCap), k = cssW / W * dpr;
  const pg = await S.sources[p.src].pdf.getPage(p.idx + 1);
  const vp = pg.getViewport({ scale: k, rotation: total(p) });
  c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext("2d");
  await pg.render({ canvasContext: ctx, viewport: vp }).promise;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.globalCompositeOperation = "multiply"; p.strokes.filter(s => s.t === "hl").forEach(s => drawStroke(ctx, s));
  ctx.globalCompositeOperation = "source-over"; p.strokes.filter(s => s.t !== "hl").forEach(s => drawStroke(ctx, s));
  ctx.fillStyle = "#FFE98A"; p.notes.forEach(n => ctx.fillRect(n.x, n.y, n.w, 16));
}

  const p = S.pages[0]; if (!p) return "";
  const c = document.createElement("canvas"); await paintPage(c, p, 180, 1.5);
  return c.toDataURL("image/jpeg", 0.72);
}

/* Datei merken (nach Öffnen und Speichern) */
async function rememberRecent(bytes) {
  const f = S.file; if (!f || f.origin === "sample" || f.origin === "new") return;
  const kind = f.path ? "path" : f.handle ? "handle" : "copy";
  const R = Files.st.recents;
  let e = null;
  if (kind === "path") e = R.find(r => r.kind === "path" && r.path.toLowerCase() === f.path.toLowerCase());
  else if (kind === "handle") {
    for (const r of R.filter(r => r.kind === "handle")) {
      const h = await IDB.get("h:" + r.id).catch(() => null);
      if (h && await h.isSameEntry(f.handle).catch(() => false)) { e = r; break; }
    }
  } else e = f.recentId ? R.find(r => r.id === f.recentId) : null;
  e = e || { id: uid(), kind };
  Object.assign(e, { name: f.name, where: whereOf(f), openedAt: Date.now(), pages: S.pages.length, size: bytes ? bytes.length : e.size });
  try { e.thumb = await coverThumb(); } catch (err) { console.warn(err); }
  if (kind === "path") e.path = f.path;
  try {
    if (kind === "handle") await IDB.set("h:" + e.id, f.handle);
    if (kind === "copy" && bytes) await IDB.set("c:" + e.id, bytes);
  } catch (err) { console.warn("Nicht gemerkt", err); }
  f.recentId = e.id;
  const list = [e, ...R.filter(r => r !== e)], keep = [];
  let copies = 0;
  for (const r of list) {
    if (keep.length < MAX_RECENTS && !(r.kind === "copy" && ++copies > MAX_COPIES)) keep.push(r);
    else forgetData(r);
  }
  Files.st.recents = keep;
  await Files.persist(); renderHome();
}
function forgetData(r) { if (r.kind !== "path") { IDB.del("h:" + r.id).catch(() => {}); IDB.del("c:" + r.id).catch(() => {}); } }
async function removeRecent(id) {
  const r = Files.st.recents.find(x => x.id === id); if (!r) return;
  Files.st.recents = Files.st.recents.filter(x => x !== r); forgetData(r);
  await Files.persist(); renderHome();
}

/* ---------- Speichern ---------- */
async function confirmDiscard() {
  if (!S.dirty) return true;
  const v = await dialog({ title: "Ungespeicherte Änderungen", html: "<p>Das aktuelle Dokument hat Änderungen, die noch nicht gespeichert sind.</p>",
    buttons: [{ label: "Abbrechen", value: null }, { label: "Verwerfen", value: "discard", danger: true }, { label: "Erst speichern", value: "save", primary: true }] });
  if (v === "save") return await save();
  return v === "discard";
}
async function save() {
  if (!S.pages.length) return false;
  document.activeElement && document.activeElement.blur();
  const f = S.file || {};
  if (DESKTOP) return f.path ? saveToPath(f.path) : saveAs();
  if (f.handle) return saveToHandle();
  return download(true);
}
async function saveAs() {
  if (!S.pages.length) return false;
  if (!DESKTOP) return download(true);
  const f = S.file || {};
  const r = await fileBrowser({ mode: "save", name: f.name || "Dokument.pdf", start: f.path ? dirName(f.path) : Files.st.lastFolder });
  if (!r) return false;
  if (r.path.toLowerCase() !== (f.path || "").toLowerCase()) {
    const st = await (await desktopApi("/__api/stat?path=" + encodeURIComponent(r.path))).json();
    if (st.exists) {
      const ok = await dialog({ title: "Datei ersetzen?", html: `<p>„${escapeHtml(baseName(r.path))}“ gibt es in diesem Ordner schon.</p>`,
        buttons: [{ label: "Abbrechen", value: null }, { label: "Ersetzen", value: true, danger: true }] });
      if (!ok) return false;
    }
  }
  return saveToPath(r.path);
}
async function saveToPath(path) {
  busy("Wird gespeichert …");
  try {
    const bytes = await buildPdf();
    await desktopApi("/__api/save?path=" + encodeURIComponent(path), { method: "POST", headers: { "Content-Type": "application/pdf" }, body: bytes });
    S.file = { ...(S.file || {}), name: baseName(path), origin: "local", desktop: true, path, handle: null };
    Files.st.lastFolder = dirName(path);
    busy(); setDirty(false, "Gespeichert"); toast(`In „${S.file.name}“ gespeichert.`);
    rememberRecent(bytes); return true;
  } catch (e) { busy(); console.error(e); toast("Speichern nicht möglich: " + e.message, true); return false; }
}
async function saveToHandle() {
  busy("Wird gespeichert …");
  try {
    const bytes = await buildPdf();
    const w = await S.file.handle.createWritable(); await w.write(bytes); await w.close();
    busy(); setDirty(false, "Gespeichert"); toast("Datei auf dem Gerät gespeichert.");
    rememberRecent(bytes); return true;
  } catch (e) { busy(); console.error(e); toast("Speichern nicht möglich: " + e.message, true); return false; }
}
async function download(askName = true) {
  busy("PDF wird erzeugt …");
  try {
    const bytes = await buildPdf();
    const blob = new Blob([bytes], { type: "application/pdf" });
    const name = (S.file?.name || "Dokument.pdf").replace(/(\.pdf)?$/i, m => m || ".pdf");
    const dl = await viewerDownloads();
    if (dl) {   // gehostete Seite: der Viewer fragt nach und speichert (iPad: „In Dateien sichern“)
      try {
        busy();
        await dl.save({ filename: name, data: blob });
        if (S.file && S.file.origin !== "sample") S.file.origin = "local";
        setDirty(false, "Gespeichert"); toast("PDF gespeichert."); rememberRecent(bytes); return true;
      } catch (e) {
        if (e && e.code === "declined") { toast("Speichern abgebrochen."); return false; }
        if (e && e.code === "rate_limited") { toast("Bitte kurz warten und erneut speichern.", true); return false; }
        toast("Speichern ist in dieser Ansicht nicht möglich (" + (e && (e.message || e.code) || "unbekannt") + ").", true); return false;
      }
    }
    if (askName && window.showSaveFilePicker && !isHosted()) {   // Edge/Chrome: Speicherort und Namen wählen
      try {
        const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: "PDF", accept: { "application/pdf": [".pdf"] } }] });
        const w = await h.createWritable(); await w.write(blob); await w.close();
        S.file = { ...(S.file || {}), name: h.name, origin: "local", handle: h };
        busy(); setDirty(false, "Gespeichert"); toast("Datei gespeichert."); rememberRecent(bytes); return true;
      } catch (e) { if (e.name === "AbortError") { busy(); return false; } console.warn(e); }
    }
    // iPad/iPhone (Web-App vom Home-Bildschirm): Teilen-Menü mit „In Dateien sichern“.
    // Teilen braucht einen frischen Fingertipp, darum erst nach dem Erzeugen ein eigener Knopf.
    const file = typeof File === "function" ? new File([blob], name, { type: "application/pdf" }) : null;
    if (file && !window.showSaveFilePicker && navigator.canShare && navigator.canShare({ files: [file] })) {
      busy();
      const r = await dialog({
        title: "PDF sichern",
        html: `<p>„${escapeHtml(name)}“ ist bereit. Tippe auf „In Dateien sichern“ und wähle im Teilen-Menü den Speicherort, z. B. iCloud Drive oder OneDrive.</p>`,
        buttons: [{ label: "Abbrechen", value: null }, { label: "In Dateien sichern", primary: true,
          value: () => navigator.share({ files: [file], title: name }).then(() => "ok", e => e && e.name === "AbortError" ? "abort" : "error:" + (e && e.message)) }]
      });
      if (r === "ok") {
        if (S.file && S.file.origin !== "sample") S.file.origin = "local";
        setDirty(false, "Gespeichert"); toast("PDF gesichert."); rememberRecent(bytes); return true;
      }
      if (r && String(r).startsWith("error:")) toast("Teilen nicht möglich: " + String(r).slice(6), true);
      return false;
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    if (S.file && S.file.origin !== "sample") S.file.origin = "local";
    busy(); setDirty(false, "Heruntergeladen"); toast("PDF wurde heruntergeladen."); rememberRecent(bytes); return true;
  } catch (e) { busy(); console.error(e); toast("PDF konnte nicht erzeugt werden: " + e.message, true); return false; }
}

/* ---------- Favoriten-Ordner ---------- */
function isFavPath(p) { return Files.st.favorites.some(f => f.kind === "path" && f.path.toLowerCase() === p.toLowerCase()); }
async function toggleFavPath(path, name) {
  if (isFavPath(path)) Files.st.favorites = Files.st.favorites.filter(f => !(f.kind === "path" && f.path.toLowerCase() === path.toLowerCase()));
  else Files.st.favorites.push({ id: uid(), kind: "path", path, name: name || baseName(path) });
  await Files.persist(); renderHome();
}
async function favIdForHandle(h) {
  for (const f of Files.st.favorites.filter(f => f.kind === "handle")) {
    const x = await IDB.get("d:" + f.id).catch(() => null);
    if (x && await x.isSameEntry(h).catch(() => false)) return f.id;
  }
  return null;
}
async function toggleFavHandle(h) {
  const id = await favIdForHandle(h);
  if (id) { Files.st.favorites = Files.st.favorites.filter(f => f.id !== id); IDB.del("d:" + id).catch(() => {}); }
  else { const f = { id: uid(), kind: "handle", name: h.name }; await IDB.set("d:" + f.id, h); Files.st.favorites.push(f); }
  await Files.persist(); renderHome();
}
async function removeFavorite(id) {
  Files.st.favorites = Files.st.favorites.filter(f => f.id !== id); IDB.del("d:" + id).catch(() => {});
  await Files.persist(); renderHome();
}
async function addFavorite() {
  if (DESKTOP) { await fileBrowser({ mode: "folder" }); return; }
  if (!CAN.dirs) {
    dialog({ title: "Ordner merken", html: "<p>Dieser Browser kann Ordner nicht dauerhaft freigeben (z. B. Safari auf dem iPad). Nutze „Zuletzt geöffnet“ oder öffne Dateien über die Dateien-App.</p>" });
    return;
  }
  try {
    const h = await showDirectoryPicker({ mode: "readwrite" });
    if (await favIdForHandle(h)) { toast(`„${h.name}“ ist schon ein Favorit.`); return; }
    await toggleFavHandle(h); toast(`„${h.name}“ als Favorit gemerkt.`);
  } catch (e) { if (e.name !== "AbortError") toast("Ordner konnte nicht gemerkt werden: " + e.message, true); }
}
async function openFavorite(fav) {
  let start = fav.path;
  if (fav.kind === "handle") {
    const h = await IDB.get("d:" + fav.id).catch(() => null);
    if (!h) { toast("Dieser Ordner ist nicht mehr verfügbar.", true); return; }
    if ((await h.queryPermission({ mode: "readwrite" })) !== "granted" && (await h.requestPermission({ mode: "readwrite" })) !== "granted") {
      toast("Ohne Freigabe kann PDF-vibe-viewer den Ordner nicht anzeigen.", true); return;
    }
    start = h;
  }
  if (!(await confirmDiscard())) return;
  const r = await fileBrowser({ mode: "open", start }); if (r) openBrowsed(r);

/* ---------- Datei-Browser ----------
   mode: open (PDF wählen) · folder (Ordner als Favorit merken) · save (Ordner + Dateiname)
   Orte: exe = Pfade über den Server; Web = Ordnerfreigaben (FileSystemDirectoryHandle) */
async function listLocation(loc) {
  if (loc.path != null) {
    const d = await (await desktopApi("/__api/list?path=" + encodeURIComponent(loc.path))).json();
    return { name: d.name, items: d.items.map(i => ({ name: i.name, dir: i.dir, size: i.size, mtime: i.mtime, loc: { path: i.path, name: i.name } })) };
  }
  const items = [];
  for await (const [name, h] of loc.handle.entries()) {
    if (name.startsWith(".")) continue;
    if (h.kind === "directory") items.push({ name, dir: true, loc: { handle: h, name } });
    else if (/\.pdf$/i.test(name)) { let f = null; try { f = await h.getFile(); } catch {} items.push({ name, dir: false, size: f?.size, mtime: f?.lastModified, loc: { handle: h, name } }); }
    if (items.length > 1000) break;
  }
  items.sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name, "de", { numeric: true }));
  return { name: loc.handle.name, items };
}
function trailForPath(p) {
  const sep = p.includes("\\") ? "\\" : "/", parts = p.split(/[\\/]/).filter(Boolean), out = [];
  let acc = sep === "/" ? "" : "";
  if (sep === "/") out.push({ name: "/", path: "/" });
  parts.forEach((part, i) => {
    acc = sep === "/" ? acc + "/" + part : (i === 0 ? part + "\\" : acc.replace(/\\?$/, "\\") + part);
    out.push({ name: i === 0 && sep === "\\" ? part : part, path: acc });
  });
  return out;
}
function fileBrowser({ mode = "open", start = null, name = "", title = "" } = {}) {
  return new Promise(async resolve => {
    const sc = document.createElement("div"); sc.className = "scrim";
    const heads = { open: "PDF öffnen", folder: "Ordner als Favorit merken", save: "Speichern unter" };
    sc.innerHTML = `<div class="dlg fbd" role="dialog" aria-modal="true">
      <header>${svg(mode === "save" ? "save" : "folder", 22)}<h3></h3>
        <button class="btn" data-fav title="Ordner als Favorit merken">${svg("star", 18)}<span>Favorit</span></button>
        <button class="btn icon" data-x aria-label="Schließen">${svg("x")}</button></header>
      <div class="fb"><nav class="fb-side" aria-label="Orte"></nav>
        <div class="fb-main"><div class="fb-crumbs"></div><div class="fb-list" role="list"></div></div></div>
      ${mode === "save" ? `<div class="fb-foot"><label for="fbName" class="vh">Dateiname</label><input id="fbName" autocomplete="off" spellcheck="false"><button class="btn primary" data-ok>Hier speichern</button></div>` : ""}
      ${mode === "folder" ? `<div class="fb-foot"><span class="fb-hint">Ordner auswählen und hinzufügen</span><span class="spacer"></span><button class="btn primary" data-ok>Diesen Ordner hinzufügen</button></div>` : ""}
    </div>`;
    $("h3", sc).textContent = title || heads[mode];
    document.body.append(sc);
    const close = v => { sc.remove(); document.removeEventListener("keydown", esc, true); resolve(v); };
    const esc = e => { if (e.key === "Escape") { e.stopPropagation(); close(null); } };
    document.addEventListener("keydown", esc, true);
    $("[data-x]", sc).onclick = () => close(null);
    sc.addEventListener("pointerdown", e => { if (e.target === sc) close(null); });
    const side = $(".fb-side", sc), list = $(".fb-list", sc), crumbs = $(".fb-crumbs", sc), favBtn = $("[data-fav]", sc);
    let cur = null, trail = [];

    async function go(loc, newTrail) {
      cur = loc; trail = newTrail || (loc.path != null ? trailForPath(loc.path).map(t => ({ name: t.name, loc: { path: t.path, name: t.name } })) : [...trail, { name: loc.name, loc }]);
      crumbs.innerHTML = "";
      trail.forEach((t, i) => {
        if (i) crumbs.insertAdjacentHTML("beforeend", "<span>›</span>");
        const b = document.createElement("button"); b.textContent = t.name; b.onclick = () => go(t.loc, trail.slice(0, i + 1)); crumbs.append(b);
      });
      $$("button", side).forEach(b => b.classList.toggle("on", !!b._loc && (b._loc.path != null ? b._loc.path === loc.path : b._loc.handle === loc.handle)));
      updateFav();
      list.innerHTML = `<div class="fb-empty"><span class="spin"></span></div>`;
      try {
        const d = await listLocation(loc);
        if (cur !== loc) return;
        list.innerHTML = "";
        const shown = mode === "open" ? d.items : d.items.filter(i => i.dir);
        if (!shown.length) list.innerHTML = `<div class="fb-empty">${mode === "open" ? "Keine PDFs oder Unterordner." : "Keine Unterordner."}</div>`;
        shown.forEach(it => {
          const row = document.createElement("div"); row.className = "fb-item" + (it.dir ? " dir" : ""); row.tabIndex = 0; row.setAttribute("role", "listitem");
          row.innerHTML = `<span class="ic">${svg(it.dir ? "folder" : "file", 20)}</span><span class="nm"></span><span class="meta">${it.dir ? "" : fmtSize(it.size) + (it.mtime ? " · " + relTime(it.mtime) : "")}</span>`;
          $(".nm", row).textContent = it.name;
          row.onclick = () => {
            if (it.dir) go(it.loc);
            else { if (cur.path != null) Files.st.lastFolder = cur.path; close({ path: it.loc.path, handle: it.loc.handle, name: it.name }); }
          };
          row.onkeydown = e => { if (e.key === "Enter") row.click(); };
          list.append(row);
        });
      } catch (e) { if (cur === loc) list.innerHTML = `<div class="fb-empty"></div>`, $(".fb-empty", list).textContent = e.message || "Ordner kann nicht gelesen werden."; }
    }
    async function updateFav() {
      if (!cur) return;
      const on = cur.path != null ? isFavPath(cur.path) : !!(await favIdForHandle(cur.handle));
      favBtn.classList.toggle("on", on); favBtn.querySelector("span").textContent = on ? "Favorit" : "Als Favorit";
      favBtn.querySelector("svg").outerHTML = svg(on ? "starFill" : "star", 18);
    }
    favBtn.onclick = async () => {
      if (!cur) return;
      if (cur.path != null) await toggleFavPath(cur.path, trail[trail.length - 1]?.name);
      else await toggleFavHandle(cur.handle);
      await updateFav(); await buildSide(); go(cur, trail);
    };
    async function buildSide() {
      side.innerHTML = "";
      const head = t => side.insertAdjacentHTML("beforeend", `<div class="mh">${t}</div>`);
      const add = (label, icon, loc, extraCls = "") => {
        const b = document.createElement("button"); b.innerHTML = svg(icon, 18) + "<span></span>"; $("span", b).textContent = label;
        b.className = extraCls; b._loc = loc; b.onclick = () => go(loc); side.append(b); return b;
      };
      const favs = Files.st.favorites;
      if (favs.length) {
        head("Favoriten");
        for (const f of favs) {
          if (f.kind === "path" && DESKTOP) add(f.name, "starFill", { path: f.path, name: f.name }, "fav-on");
          if (f.kind === "handle" && !DESKTOP) { const h = await IDB.get("d:" + f.id).catch(() => null); if (h) add(f.name, "starFill", { handle: h, name: f.name }, "fav-on"); }
        }
      }
      if (DESKTOP) {
        head("Orte");
        try {
          const places = await (await desktopApi("/__api/places")).json();
          places.forEach(p => add(p.name, p.kind === "drive" ? "drive" : p.kind === "cloud" ? "cloud" : "folder", { path: p.path, name: p.name }));
        } catch (e) { console.warn(e); }
      } else {
        const b = document.createElement("button"); b.innerHTML = svg("plus", 18) + "<span>Ordner freigeben …</span>";
        b.onclick = async () => { try { const h = await showDirectoryPicker({ mode: "readwrite" }); go({ handle: h, name: h.name }, [{ name: h.name, loc: { handle: h, name: h.name } }]); } catch {} };
        side.append(b);
      }
    }
    await buildSide();
    if (mode === "save") { const inp = $("#fbName", sc); inp.value = name.replace(/(\.pdf)?$/i, m => m || ".pdf"); inp.focus(); inp.setSelectionRange(0, Math.max(0, inp.value.length - 4)); }
    const ok = $("[data-ok]", sc);
    if (ok) ok.onclick = async () => {
      if (!cur || cur.path == null) return;
      if (mode === "folder") { if (!isFavPath(cur.path)) await toggleFavPath(cur.path, trail[trail.length - 1]?.name); toast(`„${trail[trail.length - 1]?.name}“ als Favorit gemerkt.`); close({ path: cur.path }); return; }
      let n = $("#fbName", sc).value.trim().replace(/[\\/:*?"<>|]/g, "-");
      if (!n) return; if (!/\.pdf$/i.test(n)) n += ".pdf";
      const sep = cur.path.includes("\\") ? "\\" : "/";
      Files.st.lastFolder = cur.path;
      close({ path: cur.path.replace(/[\\/]$/, "") + sep + n, name: n });
    };
    if (mode === "save") $("#fbName", sc).onkeydown = e => { if (e.key === "Enter") ok.click(); };
    // Startort: übergebener Ordner, zuletzt benutzter Ordner oder erster Ort
    let startLoc = null;
    if (start && typeof start === "object") startLoc = { handle: start, name: start.name };
    else if (start) startLoc = { path: start, name: baseName(start) };
    else if (DESKTOP && Files.st.lastFolder) startLoc = { path: Files.st.lastFolder, name: baseName(Files.st.lastFolder) };
    if (!startLoc) { const first = $$("button", side).find(b => b._loc); if (first) startLoc = first._loc; }
    if (startLoc) go(startLoc, startLoc.handle ? [{ name: startLoc.name, loc: startLoc }] : undefined);
    else list.innerHTML = `<div class="fb-empty">Links einen Ordner freigeben.</div>`;
  });
}

  add.onclick = addFavorite; add.onkeydown = e => { if (e.key === "Enter") addFavorite(); };
  fl.append(add);
}

/* =====================================================================
   PDF komprimieren: Bilder verkleinern und als JPEG neu speichern
   Text, Vektorgrafik und Markierungen bleiben unverändert.
   ===================================================================== */
const COMPRESS = {
  light: { label: "Leicht", max: 2400, q: 0.85, desc: "Bilder bis 2400 px, Qualität 85 %. Kaum sichtbarer Unterschied." },
  medium: { label: "Mittel", max: 1600, q: 0.72, desc: "Bilder bis 1600 px, Qualität 72 %. Empfohlen für Skripte und Scans." },
  strong: { label: "Stark", max: 1100, q: 0.55, desc: "Bilder bis 1100 px, Qualität 55 %. Kleinste Datei, Fotos etwas unschärfer." }
};
async function inflate(bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function deflate(bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
// PNG-Prädiktoren (Predictor ≥ 10) rückgängig machen
function unpredict(raw, w, h, comps) {
  const row = w * comps, out = new Uint8Array(row * h);
  if (raw.length < (row + 1) * h) return null;
  for (let y = 0; y < h; y++) {
    const ft = raw[y * (row + 1)], src = y * (row + 1) + 1, dst = y * row;
